# PIXEL-OPS Photogrammetry Pipeline Configuration
# All tunable parameters - no magic numbers in source code.
# Round 2: Four 1280x720 @ 59.94fps MOV videos (AU Alfresco, "Alfresco" site).
#   Video 1: 3406 frames, 56.8s
#   Video 2: 3542 frames, 59.1s
#   Video 3: 2839 frames, 47.4s
#   Video 4: 2518 frames, 42.0s
#   Total: 12,305 source frames

# -- Video Input (Round 2) ----------------------------------------------------
video:
  # Directory containing .MOV files (overridden by --video-dir CLI flag)
  video_dir: "C:\\Users\\anuti\\Downloads\\OneDrive_2026-09-26\\2nd round"
  extensions: [".mov", ".mp4", ".avi", ".mkv", ".m4v"]
  # Extract one frame every N seconds. At 2.0s: ~28 frames per video (~113 total).
  frame_interval_seconds: 2.0
  # Optional: skip first N seconds (camera startup, pointing at ground, etc.)
  start_offset_seconds: 0.0
  # Optional: skip last N seconds
  end_trim_seconds: 0.0
  # Max frames per video (0 = no limit). Set e.g. 40 for fast test runs.
  max_frames_per_video: 0
  # Output directory for extracted JPEG frames (relative to output_dir).
  # IMPORTANT: this dir must NOT be auto-discovered by the image pipeline.
  frames_dir: "video_frames"
  # Manifest file name (saved to output_dir)
  manifest: "video_frames_manifest.json"
  # JPEG write quality (1-100)
  jpeg_quality: 95

  # ── Quality filter (Laplacian variance sharpness) ──────────────────────────
  quality:
    enabled: true
    # Scoring done on frames downscaled to this max dimension.
    max_dim: 960
    # Adaptive threshold uses per-video statistics:
    #   threshold = max(min_absolute_variance, median - mad_k * robust_sigma)
    # then capped to never remove more than max_removal_percent.
    mad_k: 3.0
    min_absolute_variance: 6.0
    max_removal_percent: 35.0
    min_keep_frames: 5

  # ── Near-duplicate filter ──────────────────────────────────────────────────
  near_duplicate:
    enabled: true
    # Mean absolute pixel difference (normalised 0..1). Lower = stricter.
    mean_abs_diff_threshold: 0.012
    # Pearson correlation of 64x36 thumbnail. Higher = stricter.
    correlation_threshold: 0.999
    # Require BOTH metrics to flag a frame as duplicate (conservative).
    require_both_metrics: true

# -- Image Discovery ----------------------------------------------------------
# For Round 2, image discovery is handled via video_frames/
# The pipeline reads from the extracted frames directory.
image:
  extensions: [".jpg", ".jpeg", ".JPG", ".JPEG"]
  # 0 = use all extracted frames; set N to limit for testing
  max_images: 0
  # Max dimension for SIFT/matching.
  # All Round-2 frames are 1280x720; setting 1280 uses them at native resolution.
  resize_for_processing: 1280

# -- Camera Model -------------------------------------------------------------
# Round-2 frames are 1280x720. No EXIF focal length in extracted JPEGs.
# We use focal_length_ratio × max(1280, 720) = 1.2 × 1280 = 1536 px (estimated).
camera:
  focal_length_ratio: 1.2
  focal_length_override: null
  distortion_model: "none"

# -- Feature Extraction -------------------------------------------------------
features:
  method: "SIFT"
  sift_nfeatures: 6000
  sift_contrast_threshold: 0.02
  sift_edge_threshold: 10
  orb_nfeatures: 6000
  save_visualizations: false

# -- Feature Matching ---------------------------------------------------------
matching:
  method: "FLANN"
  ratio_threshold: 0.78
  min_matches: 25
  strategy: "exhaustive"
  sequential_window: 25
  cross_check: false

# -- Geometric Verification ---------------------------------------------------
geometry:
  fundamental_ransac_threshold: 2.0
  fundamental_confidence: 0.999
  essential_ransac_threshold: 1.5
  essential_confidence: 0.999
  min_inliers: 12
  min_inlier_ratio: 0.12

# -- Initial Pair Selection ---------------------------------------------------
init:
  min_initial_inliers: 30
  max_initial_score_pairs: 20

# -- Triangulation ------------------------------------------------------------
triangulation:
  max_reprojection_error: 6.0
  min_parallax_degrees: 0.5
  min_depth: 0.01
  max_depth: 2000.0

# -- PnP (Camera Registration) ------------------------------------------------
pnp:
  min_correspondences: 6
  ransac_threshold: 10.0
  ransac_confidence: 0.999
  max_reprojection_error: 15.0

# -- Bundle Adjustment --------------------------------------------------------
bundle_adjustment:
  enabled: false
  max_iterations: 50
  ftol: 1.0e-4
  xtol: 1.0e-4
  gtol: 1.0e-8
  loss_function: "huber"
  max_points_for_ba: 5000

# -- Depth Estimation ---------------------------------------------------------
depth:
  enabled: true
  max_depth_images: 50
  num_neighbors: 4
  patch_size: 9
  num_depth_hypotheses: 96
  ncc_threshold: 0.35
  depth_fill: false
  min_shared_landmarks: 10
  min_landmarks_for_ref: 20
  d_min: 0.5
  d_max: 50.0
  adaptive_depth_range: true
  adaptive_min_landmarks: 20
  depth_range_percentiles: [5.0, 95.0]
  depth_range_padding: 0.20
  min_depth_range: 2.0
  max_adaptive_depth: 2000.0
  confidence_margin: 0.04
  min_valid_before_fill_pct: 15.0
  fill_iterations: 1

# -- Dense Fusion -------------------------------------------------------------
fusion:
  voxel_size: 0.05
  statistical_outlier_nb: 20
  statistical_outlier_std: 2.5
  radius_outlier_radius: 0.1
  radius_outlier_min_points: 5
  max_points_per_depth_image: 50000

# -- Visualization ------------------------------------------------------------
visualization:
  point_size: 2.0
  background_color: [0.1, 0.1, 0.1]
  show_cameras: true
  camera_scale: 0.3
  zoom: 0.5

# -- Output -------------------------------------------------------------------
output:
  # Round-2 output structure
  output_dir: "outputs_round2"
  sparse_ply: "sparse/sparse_points.ply"
  dense_ply: "dense/point_cloud.ply"
  screenshot: "visualization/reconstruction_screenshot.png"
  report_json: "reports/reconstruction_report.json"
  report_txt: "reports/reconstruction_report.txt"
  dataset_report: "reports/dataset_report.json"
  feature_report: "reports/feature_report.json"
  matching_report: "reports/matching_report.json"
  connectivity_json: "connectivity/connectivity_report.json"
  connectivity_txt: "connectivity/connectivity_report.txt"
